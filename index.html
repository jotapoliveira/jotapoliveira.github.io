
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Researcher Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'selector',
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; box-shadow: 0 0 20px rgba(249, 115, 22, 0.2); }
            50% { opacity: 1; box-shadow: 0 0 40px rgba(249, 115, 22, 0.5); }
        }

        @keyframes reveal-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }

        .stagger-1 { animation: reveal-up 0.8s ease-out forwards; animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation: reveal-up 0.8s ease-out forwards; animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation: reveal-up 0.8s ease-out forwards; animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation: reveal-up 0.8s ease-out forwards; animation-delay: 0.4s; opacity: 0; }
        .stagger-5 { animation: reveal-up 0.8s ease-out forwards; animation-delay: 0.5s; opacity: 0; }

        .image-ring {
            position: absolute;
            inset: -8px;
            border-radius: 9999px;
            border: 2px dashed rgba(249, 115, 22, 0.3);
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
<script type="importmap">
{

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

  }
}
</script>

</head>

</html>
